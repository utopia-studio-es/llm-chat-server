<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Utopia Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090d;
      --surface: #111318;
      --border: #252836;
      --text: #eaecf5;
      --text-dim: #6b7194;
      --accent: #667eea;
      --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .bg-glow {
      position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(102,126,234,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .container { max-width: 420px; width: 100%; padding: 2rem; position: relative; z-index: 1; }
    .logo { text-align: center; margin-bottom: 2.5rem; }
    .logo img { height: 56px; margin-bottom: 0.75rem; }
    .logo h1 {
      font-size: 1.25rem; font-weight: 700;
      background: var(--gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .card {
      background: var(--surface); border-radius: 20px; padding: 2.5rem;
      border: 1px solid var(--border); box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }
    .card h2 { font-size: 1.6rem; margin-bottom: 0.4rem; text-align: center; font-weight: 700; }
    .card p { text-align: center; color: var(--text-dim); margin-bottom: 2rem; font-size: 0.9rem; }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; font-weight: 600; color: var(--text-dim); }
    .field input {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      color: var(--text); padding: 0.85rem 1rem; border-radius: 12px;
      font-size: 0.95rem; font-family: inherit; transition: border 0.2s;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    .btn {
      width: 100%; background: var(--gradient); color: white; border: none;
      padding: 0.95rem; border-radius: 12px; font-size: 1rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      color: #f87171; padding: 0.7rem 1rem; border-radius: 10px;
      margin-bottom: 1.25rem; font-size: 0.85rem; text-align: center;
    }
    .error.hidden { display: none; }
    .footer { text-align: center; margin-top: 2rem; color: var(--text-dim); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="logo">
      <img src="/static/logo.png" alt="Utopia Labs" onerror="this.style.display='none'">
      <h1>Utopia Labs AI</h1>
    </div>
    <div class="card">
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>
      <div id="error" class="error hidden"></div>
      <form id="form">
        <div class="field">
          <label for="user">Usuario</label>
          <input type="text" id="user" required autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="btn">Iniciar sesión</button>
      </form>
    </div>
    <div class="footer">Powered by Qwen2-VL-7B · Utopia Labs</div>
  </div>
  <script>
    if (localStorage.getItem('auth_token')) window.location.href = '/chat';

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('error');
      const btn = document.getElementById('btn');
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Iniciando sesión…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('user').value, password: document.getElementById('pass').value })
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('auth_token', data.token);
          window.location.href = '/chat';
          return;
        }
        err.textContent = 'Usuario o contraseña incorrectos';
        err.classList.remove('hidden');
      } catch {
        err.textContent = 'Error de conexión';
        err.classList.remove('hidden');
      }
      btn.disabled = false; btn.textContent = 'Iniciar sesión';
    });
  </script>
</body>
</html>
